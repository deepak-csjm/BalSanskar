# BalSanskar, running end to end on one machine.
#
# This is the shape of the first real deployment: a single VM in a district
# office or a state data centre, with PostgreSQL and MinIO alongside the two
# application containers. It is also what a developer runs locally.
#
#   cp apps/api/.env.example .env    # then edit JWT_SECRET and the passwords
#   docker compose up --build
#
# For a state-wide rollout, replace the `db` service with a managed PostgreSQL
# instance and `storage` with the department's object store; nothing in the
# application changes beyond DATABASE_URL and the S3_* variables.

name: balsanskar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balsanskar}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      POSTGRES_DB: ${POSTGRES_DB:-balsanskar}
      # Deterministic collation, so index ordering does not shift under a base
      # image upgrade and quietly corrupt unique indexes.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-balsanskar} -d ${POSTGRES_DB:-balsanskar}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API needs to reach it.
    expose:
      - '5432'

  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}'
      MINIO_ROOT_PASSWORD: '${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - '9000'
    ports:
      # The console, for an administrator to inspect the bucket. Bound to
      # localhost so it is not exposed by accident.
      - '127.0.0.1:9001:9001'

  storage-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-balsanskar}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'bucket ready and private'
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-balsanskar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-balsanskar}?schema=public'
      # Generate with: openssl rand -base64 48
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env}'
      PUBLIC_API_BASE_URL: '${PUBLIC_API_BASE_URL:-http://localhost:4000}'
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:8080}'
      TRUST_PROXY: ${TRUST_PROXY:-true}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: 'http://storage:9000'
      S3_BUCKET: ${S3_BUCKET:-balsanskar}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      SMS_PROVIDER: ${SMS_PROVIDER:-msg91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
    # Migrations run before the process accepts traffic. Safe to repeat: Prisma
    # applies only what is missing.
    command: >
      /bin/sh -c "node node_modules/prisma/build/index.js migrate deploy && node dist/server.js"
    ports:
      - '${API_PORT:-4000}:4000'

  # Housekeeping that has to happen on a clock, in the same image as the API.
  #
  # Two jobs, one of which is a child-safety matter rather than tidiness: every
  # activity form somebody starts and abandons leaves a photograph in the
  # bucket, attached to nothing and shown in no interface where anyone would
  # notice it. Without this it stays for the life of the deployment.
  #
  # A loop in a sidecar rather than a timer inside the API, because a timer
  # inside the API runs once per replica and only while that process happens to
  # be up. On Kubernetes this is a CronJob; on a plain host, a cron entry
  # running `pnpm --filter @balsanskar/api maintenance:prod`. Both jobs are
  # idempotent and only touch rows already past their deadline, so a run that
  # overlaps the previous one is harmless.
  maintenance:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-balsanskar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-balsanskar}?schema=public'
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env}'
      STORAGE_DRIVER: s3
      S3_ENDPOINT: 'http://storage:9000'
      S3_BUCKET: ${S3_BUCKET:-balsanskar}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
    command: >
      /bin/sh -c "while true; do node dist/maintenance.js || echo 'maintenance run failed'; sleep ${MAINTENANCE_INTERVAL_SECONDS:-3600}; done"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: '${VITE_API_BASE_URL:-http://localhost:4000}'
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  db-data:
  storage-data:

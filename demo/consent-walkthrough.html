<title>BalSanskar Consent Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap"
/>

<style>
  /* ---------------------------------------------------------------------
     BalSanskar — consent walkthrough

     Palette taken from the schools themselves: the deep green of a
     blackboard and the turmeric ochre of a Basic Shiksha building, on the
     warm paper of a school register. Greys are biased green so they sit in
     the same family rather than reading as default UI grey.
     --------------------------------------------------------------------- */

  :root {
    --board: #1b4b3e;
    --board-deep: #123329;
    --board-tint: #e4ede9;
    --haldi: #c4791f;
    --haldi-tint: #fbf0dd;
    --ok: #1b6b4a;
    --ok-tint: #e2efe8;
    --stop: #a32f28;
    --stop-tint: #fae9e8;

    --paper: #fbf9f4;
    --surface: #ffffff;
    --sunk: #f2efe6;
    --rule: #e0dccf;
    --rule-strong: #cdc7b5;

    --ink: #1a1b18;
    --ink-soft: #565a52;
    --ink-faint: #83887c;

    --shadow: 0 1px 2px rgb(26 27 24 / 7%), 0 6px 20px rgb(26 27 24 / 6%);
    --shadow-lift: 0 10px 40px rgb(18 51 41 / 18%);

    --sans: 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Noto Serif Devanagari', Georgia, serif;

    --r-sm: 8px;
    --r: 12px;
    --r-lg: 18px;
    --tap: 48px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --board: #2f7a64;
      --board-deep: #256052;
      --board-tint: #1d2c27;
      --haldi: #e0a253;
      --haldi-tint: #2e2417;
      --ok: #5cb98f;
      --ok-tint: #16291f;
      --stop: #e08a83;
      --stop-tint: #2d1b19;

      --paper: #14160f;
      --surface: #1c1f19;
      --sunk: #23271f;
      --rule: #333829;
      --rule-strong: #454b3b;

      --ink: #f0eee5;
      --ink-soft: #b3b6a9;
      --ink-faint: #878b7d;

      --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
      --shadow-lift: 0 10px 40px rgb(0 0 0 / 50%);
    }
  }

  :root[data-theme='dark'] {
    --board: #2f7a64;
    --board-deep: #256052;
    --board-tint: #1d2c27;
    --haldi: #e0a253;
    --haldi-tint: #2e2417;
    --ok: #5cb98f;
    --ok-tint: #16291f;
    --stop: #e08a83;
    --stop-tint: #2d1b19;

    --paper: #14160f;
    --surface: #1c1f19;
    --sunk: #23271f;
    --rule: #333829;
    --rule-strong: #454b3b;

    --ink: #f0eee5;
    --ink-soft: #b3b6a9;
    --ink-faint: #878b7d;

    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
    --shadow-lift: 0 10px 40px rgb(0 0 0 / 50%);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    /* Devanagari needs more vertical room than Latin to stay legible. */
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
  }

  h1,
  h2,
  h3 {
    font-family: var(--serif);
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
  }

  p {
    margin: 0;
  }

  a {
    color: var(--board);
  }

  button {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--haldi);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* --- Page frame ---------------------------------------------------- */

  .demo-banner {
    background: var(--haldi);
    color: #22160a;
    font-size: 0.8rem;
    font-weight: 600;
    text-align: center;
    padding: 0.5rem 1rem;
    line-height: 1.45;
  }

  .stage {
    display: grid;
    gap: 1.5rem;
    grid-template-columns: 1fr;
    align-items: start;
    max-width: 62rem;
    margin: 0 auto;
    padding-inline: 1rem;
    padding-block: 1.25rem 3rem;
  }

  @media (min-width: 62rem) {
    .stage {
      grid-template-columns: 24rem 1fr;
      gap: 2.5rem;
      padding-block: 2.5rem 4rem;
    }
  }

  /* The handset. On a phone it disappears and the app fills the screen —
     a bezel drawn around a real phone would be absurd. */
  .handset {
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--rule);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 34rem;
  }

  @media (min-width: 62rem) {
    .handset {
      border-radius: 26px;
      border: 8px solid #22251d;
      box-shadow: var(--shadow-lift);
      position: sticky;
      top: 1.5rem;
      height: 46rem;
      min-height: 0;
    }
  }

  .app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    background: var(--paper);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 0.9rem;
    background: var(--board);
    color: #fff;
    flex: none;
  }

  .topbar__brand {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1rem;
    margin-inline-end: auto;
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .topbar__brand small {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 0.68rem;
    opacity: 0.78;
  }

  .chip-btn {
    background: rgb(255 255 255 / 14%);
    border: 1px solid rgb(255 255 255 / 26%);
    color: #fff;
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 32px;
  }

  .chip-btn:hover {
    background: rgb(255 255 255 / 24%);
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .tabbar {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    flex: none;
  }

  .tabbar button {
    flex: 1;
    background: none;
    border: none;
    border-top: 3px solid transparent;
    padding: 0.45rem 0.2rem 0.55rem;
    min-height: var(--tap);
    font-size: 0.68rem;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .tabbar button[aria-current='page'] {
    color: var(--board);
    border-top-color: var(--board);
    font-weight: 700;
  }

  .tabbar svg {
    width: 20px;
    height: 20px;
  }

  /* --- App surfaces --------------------------------------------------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 0.85rem;
  }

  .card--flat {
    box-shadow: none;
  }

  .screen__title {
    font-size: 1.25rem;
  }

  .screen__sub {
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  .rowline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .muted {
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  .faint {
    color: var(--ink-faint);
    font-size: 0.76rem;
  }

  .eyebrow {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--sunk);
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .tag--ok {
    background: var(--ok-tint);
    color: var(--ok);
  }
  .tag--warn {
    background: var(--haldi-tint);
    color: var(--haldi);
  }
  .tag--stop {
    background: var(--stop-tint);
    color: var(--stop);
  }
  .tag--board {
    background: var(--board-tint);
    color: var(--board);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: var(--tap);
    padding: 0.5rem 0.9rem;
    border-radius: var(--r-sm);
    border: 1.5px solid transparent;
    background: var(--sunk);
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }

  .btn--primary {
    background: var(--board);
    color: #fff;
  }
  .btn--primary:hover:not(:disabled) {
    background: var(--board-deep);
  }
  .btn--stop {
    background: var(--stop);
    color: #fff;
  }
  .btn--ghost {
    background: transparent;
    border-color: var(--rule-strong);
  }
  .btn--block {
    width: 100%;
  }
  .btn--sm {
    min-height: 36px;
    padding: 0.25rem 0.6rem;
    font-size: 0.8rem;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .field > label {
    font-weight: 600;
    font-size: 0.85rem;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-height: 44px;
    padding: 0.5rem 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--rule-strong);
    border-radius: var(--r-sm);
  }

  textarea {
    min-height: 5.5rem;
    resize: vertical;
  }

  .notice {
    border-radius: var(--r-sm);
    padding: 0.65rem 0.75rem;
    font-size: 0.85rem;
    border: 1px solid var(--rule);
    background: var(--sunk);
  }

  .notice--stop {
    background: var(--stop-tint);
    border-color: var(--stop);
    color: var(--stop);
    font-weight: 600;
  }
  .notice--ok {
    background: var(--ok-tint);
    border-color: var(--ok);
    color: var(--ok);
    font-weight: 600;
  }
  .notice--warn {
    background: var(--haldi-tint);
    border-color: var(--haldi);
    color: #7a4a11;
  }

  :root[data-theme='dark'] .notice--warn,
  :root:not([data-theme='light']) .notice--warn {
    color: var(--haldi);
  }

  .checkline {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    min-height: 42px;
    padding: 0.2rem 0;
    font-size: 0.9rem;
  }

  .checkline input {
    width: 20px;
    min-height: 20px;
    height: 20px;
    margin-top: 0.5rem;
    flex: none;
  }

  .photo {
    border-radius: var(--r-sm);
    overflow: hidden;
    background: var(--sunk);
    aspect-ratio: 4 / 3;
    display: block;
    width: 100%;
  }

  .photo svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* --- The register: consent history and endorsements ------------------ */

  .register {
    border: 1px solid var(--rule-strong);
    border-radius: var(--r-sm);
    background: repeating-linear-gradient(
      var(--surface) 0 1.85rem,
      var(--rule) 1.85rem 1.9rem
    );
    padding: 0.1rem 0.7rem;
  }

  .register__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    height: 1.9rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .register__row strong {
    color: var(--ink);
    font-weight: 600;
  }

  .stamp {
    display: inline-block;
    border: 2px solid var(--ok);
    color: var(--ok);
    border-radius: 4px;
    padding: 0.1rem 0.45rem;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transform: rotate(-3deg);
  }

  .stamp--stop {
    border-color: var(--stop);
    color: var(--stop);
  }

  /* --- Guidance rail --------------------------------------------------- */

  .rail {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }

  .panel h2 {
    font-size: 1.1rem;
    margin-bottom: 0.35rem;
  }

  .panel > * + * {
    margin-top: 0.6rem;
  }

  .roles {
    display: grid;
    gap: 0.5rem;
    grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
  }

  .role {
    text-align: start;
    border: 1.5px solid var(--rule-strong);
    background: var(--surface);
    border-radius: var(--r-sm);
    padding: 0.6rem 0.7rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: var(--tap);
  }

  .role[aria-pressed='true'] {
    border-color: var(--board);
    background: var(--board-tint);
    box-shadow: inset 0 0 0 1px var(--board);
  }

  .role strong {
    font-size: 0.9rem;
  }

  /* The walkthrough is a real sequence, so it is numbered. */
  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .step {
    display: grid;
    grid-template-columns: 1.6rem 1fr;
    gap: 0.6rem;
    padding: 0.45rem 0;
    border-top: 1px solid var(--rule);
    font-size: 0.87rem;
    color: var(--ink-soft);
    align-items: start;
  }

  .step:first-child {
    border-top: none;
  }

  .step__n {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--ink-faint);
    border: 1.5px solid var(--rule-strong);
    border-radius: 50%;
    width: 1.6rem;
    height: 1.6rem;
    display: grid;
    place-items: center;
    line-height: 1;
  }

  .step--done .step__n {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }

  .step--now {
    color: var(--ink);
    font-weight: 600;
  }

  .step--now .step__n {
    border-color: var(--haldi);
    color: var(--haldi);
    box-shadow: 0 0 0 3px var(--haldi-tint);
  }

  .why {
    border-inline-start: 3px solid var(--board);
    background: var(--board-tint);
    padding: 0.6rem 0.8rem;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: 0.87rem;
  }

  .why strong {
    display: block;
    font-family: var(--serif);
  }

  .disclosure {
    border-top: 1px solid var(--rule);
    padding-top: 0.6rem;
  }

  summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    min-height: 32px;
  }

  .toast {
    position: fixed;
    inset-inline: 1rem;
    bottom: 1rem;
    max-width: 28rem;
    margin-inline: auto;
    background: var(--board-deep);
    color: #fff;
    padding: 0.7rem 0.9rem;
    border-radius: var(--r-sm);
    font-size: 0.87rem;
    box-shadow: var(--shadow-lift);
    z-index: 50;
    animation: rise 0.18s ease-out;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 2rem 1rem;
    font-size: 0.9rem;
  }
</style>

<p class="demo-banner" id="banner"></p>

<div class="stage">
  <div class="handset">
    <div class="app">
      <header class="topbar">
        <span class="topbar__brand">बालसंस्कार <small id="topbar-sub"></small></span>
        <button class="chip-btn" id="lang-toggle" type="button"></button>
        <button class="chip-btn" id="reset" type="button"></button>
      </header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="BalSanskar"></nav>
    </div>
  </div>

  <div class="rail">
    <section class="panel">
      <p class="eyebrow" id="rail-eyebrow"></p>
      <h2 id="rail-title"></h2>
      <p class="muted" id="rail-intro"></p>
      <div class="roles" id="roles"></div>
      <p class="faint" id="role-note"></p>
    </section>

    <section class="panel">
      <h2 id="steps-title"></h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <section class="panel" id="why-panel">
      <h2 id="why-title"></h2>
      <div id="why-body"></div>

    <section class="panel">
      <details class="disclosure" id="about">
        <summary id="about-summary"></summary>
        <div id="about-body"></div>
      </details>
    </section>
  </div>
</div>

<script>
  'use strict';

  /* =====================================================================
     BalSanskar — consent walkthrough

     A demonstration of the moderation and guardian-consent workflow from
     the BalSanskar platform, built so that teachers and education officers
     can try it on their own phones and say what is wrong with it.

     Two things this is NOT:
       - It is not the real system. Every rule below is enforced in this
         browser only; in the platform they are enforced on the server and
         in the database, which is the copy that counts.
       - It holds no real data. The children, teachers and school here are
         invented, nothing is uploaded, and nothing leaves this device.
     ===================================================================== */

  var STORE_KEY = 'balsanskar.demo.v1';

  // -------------------------------------------------------------------
  // Copy. Hindi first, because that is the language these schools work in.
  // -------------------------------------------------------------------
  var COPY = {
    hi: {
      banner:
        'प्रदर्शन संस्करण — यह वास्तविक प्रणाली नहीं है। कृपया किसी असली बच्चे का नाम या फ़ोटो दर्ज न करें।',
      langBtn: 'EN',
      reset: 'फिर से',
      railEyebrow: 'आज़माकर देखिए',
      railTitle: 'सहमति की प्रक्रिया',
      railIntro:
        'यह उत्तर प्रदेश बेसिक शिक्षा परिषद के विद्यालयों के लिए बने मंच का प्रदर्शन है। नीचे कोई भी भूमिका चुनकर देखिए कि किसी बच्चे की फ़ोटो सार्वजनिक होने से पहले क्या-क्या ज़रूरी है।',
      roleNote:
        'असली मंच पर आप मोबाइल पर आए कोड से साइन इन करते हैं और आपकी एक ही भूमिका होती है। यहाँ जाँचने की सुविधा के लिए आप तीनों भूमिकाएँ बदल सकते हैं।',
      stepsTitle: 'सात कदम',
      whyTitle: 'अभी क्या हुआ',
      aboutSummary: 'यह प्रदर्शन क्या है, और क्या नहीं',
      aboutBody:

  var S = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.activities && parsed.students) return parsed;
      }
    } catch (e) {
      /* private browsing, or storage blocked by policy — start fresh */
    }
    return seed();
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(S));
    } catch (e) {
      /* not being able to remember is a small loss, not an error */
    }
  }

  function t(key) {
    return COPY[S.lang][key];
  }

  function loc(value) {
    return value && typeof value === 'object' ? value[S.lang] : value;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(S.lang === 'hi' ? 'hi-IN' : 'en-IN', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  }

  // -------------------------------------------------------------------
  // Domain rules. The same rules the platform enforces server-side —
  // reproduced here so a tester can feel them, not so they are secure.
  // -------------------------------------------------------------------
  var VIS_RANK = { SCHOOL: 10, BLOCK: 20, DISTRICT: 30, PUBLIC: 40 };

  /** The highest visibility each role may approve. */
  function ceiling(role) {
    if (role === 'OFFICER') return 'PUBLIC';
    if (role === 'HEAD') return 'DISTRICT';
    return null;
  }

  function canApprove(role, vis) {
    var c = ceiling(role);
    return !!c && VIS_RANK[vis] <= VIS_RANK[c];
  }

  function studentById(id) {
    for (var i = 0; i < S.students.length; i++) {
      if (S.students[i].id === id) return S.students[i];
    }
    return null;
  }

  /**
   * Everything stopping this activity being published at `vis`.
   * Returns the whole list, not the first failure: a head teacher on a
   * slow connection should be told all of it at once.
   */
  function blockers(act, vis, role) {
    var out = [];
    if (act.status !== 'PENDING') out.push('NOT_SUBMITTED');
    if (!canApprove(role, vis)) out.push('ABOVE_ROLE');
    if (act.requested && VIS_RANK[vis] > VIS_RANK[act.requested]) out.push('ABOVE_REQUEST');
    // Consent gates the open web, and only the open web: inside the
    // platform every viewer is a named, accountable government employee.
    if (vis === 'PUBLIC') {
      var missing = act.students.filter(function (id) {
        var s = studentById(id);
        return !s || s.consent !== 'GRANTED';
      });
      if (missing.length) out.push('CONSENT:' + missing.join(','));
    }
    return out;
  }

  function blockerText(code) {
    var key = code.split(':')[0];
    if (key === 'CONSENT') {
      var names = code
        .slice(8)
        .split(',')
        .map(function (id) {
          var s = studentById(id);
          return s ? loc(s.name) : id;
        })
        .join(', ');
      return S.lang === 'hi'
        ? 'इनकी अभिभावक सहमति दर्ज नहीं है: ' + names
        : 'Guardian consent is not recorded for: ' + names;
    }
    var map = {
      hi: {
        NOT_SUBMITTED: 'यह गतिविधि अभी समीक्षा हेतु भेजी नहीं गई है।',
        ABOVE_ROLE: 'इस स्तर पर प्रकाशन का अधिकार आपकी भूमिका के पास नहीं है।',
        ABOVE_REQUEST: 'शिक्षक ने इससे कम स्तर का अनुरोध किया था।',
      },
      en: {
        NOT_SUBMITTED: 'This activity has not been sent for review.',
        ABOVE_ROLE: 'Your role cannot approve at this level.',
        ABOVE_REQUEST: 'The teacher asked for a narrower level.',
      },
    };
    return map[S.lang][key] || key;
  }

  // -------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------
  var screenEl = document.getElementById('screen');
  var toastTimer = null;

  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.remove();
    }, 4200);
  }

  function markDone(id) {
    S.done[id] = true;
    S.why = id;
  }

  function render() {
    document.documentElement.lang = S.lang;
    document.getElementById('banner').textContent = t('banner');
    document.getElementById('lang-toggle').textContent = t('langBtn');
    document.getElementById('reset').textContent = t('reset');
    document.getElementById('topbar-sub').textContent = t('school');
    document.getElementById('rail-eyebrow').textContent = t('railEyebrow');
    document.getElementById('rail-title').textContent = t('railTitle');
    document.getElementById('rail-intro').textContent = t('railIntro');
    document.getElementById('role-note').textContent = t('roleNote');
    document.getElementById('steps-title').textContent = t('stepsTitle');
    document.getElementById('why-title').textContent = t('whyTitle');
    document.getElementById('about-summary').textContent = t('aboutSummary');
    document.getElementById('about-body').innerHTML = t('aboutBody');

    renderRoles();
    renderSteps();
    renderWhy();
    renderTabs();
    renderScreen();
    save();
  }

  function renderRoles() {
    var roles = [
      { id: 'TEACHER', name: t('roleTeacher'), who: t('roleTeacherWho') },
      { id: 'HEAD', name: t('roleHead'), who: t('roleHeadWho') },
      { id: 'OFFICER', name: t('roleOfficer'), who: t('roleOfficerWho') },
    ];
    document.getElementById('roles').innerHTML = roles
      .map(function (r) {
        return (
          '<button class="role" type="button" data-role="' +
          r.id +
          '" aria-pressed="' +
          (S.role === r.id) +
          '"><strong>' +
          esc(r.name) +
          '</strong><span class="faint">' +
          esc(r.who) +
          '</span></button>'
        );
      })
      .join('');
  }

  function renderSteps() {
    var list = STEPS[S.lang];
    var nextIndex = list.length;
    for (var i = 0; i < list.length; i++) {
      if (!S.done[list[i].id]) {
        nextIndex = i;
        break;
      }
    }
    document.getElementById('steps').innerHTML = list
      .map(function (step, i) {
        var cls = S.done[step.id] ? 'step step--done' : i === nextIndex ? 'step step--now' : 'step';
        return (
          '<li class="' +
          cls +
          '"><span class="step__n" aria-hidden="true">' +
          (S.done[step.id] ? '✓' : i + 1) +
          '</span><span>' +
          esc(step.text) +
          '</span></li>'
        );
      })
      .join('');
  }

  function renderWhy() {
    var w = WHY[S.lang][S.why] || WHY[S.lang].welcome;
    document.getElementById('why-body').innerHTML =
      '<div class="why"><strong>' + esc(w.h) + '</strong>' + esc(w.p) + '</div>';
  }

  function renderTabs() {
    var tabs = [
      { id: 'home', label: t('tabHome'), ic: 'home' },
      { id: 'roster', label: t('tabRoster'), ic: 'roster' },
      { id: 'showcase', label: t('tabShowcase'), ic: 'showcase' },
    ];
    // Only school staff hold a class roster; an officer never sees one.
    if (S.role === 'OFFICER') tabs.splice(1, 1);
    document.getElementById('tabbar').innerHTML = tabs
      .map(function (tab) {
        return (
          '<button type="button" data-tab="' +
          tab.id +
          '"' +
          (S.tab === tab.id ? ' aria-current="page"' : '') +
          '>' +
          icon(tab.ic) +
          '<span>' +
          esc(tab.label) +
          '</span></button>'
        );
      })
      .join('');
  }

  function statusTag(act) {
    var cls = {
      DRAFT: 'tag',
      PENDING: 'tag tag--warn',
      PUBLISHED: 'tag tag--ok',
      REJECTED: 'tag tag--stop',
    }[act.status];
    return '<span class="' + cls + '">' + esc(t('status' + act.status)) + '</span>';
  }

  function consentTag(student) {
    var key = student.consent || 'NONE';
    var cls = {
      GRANTED: 'tag tag--ok',
      DENIED: 'tag tag--stop',
      REVOKED: 'tag tag--stop',
      NONE: 'tag tag--warn',
    }[key];
    return '<span class="' + cls + '">' + esc(t('consent' + key)) + '</span>';
  }

  function renderScreen() {
    if (S.open) return renderDetail();
    if (S.tab === 'roster') return renderRoster();
    if (S.tab === 'showcase') return renderShowcase();
    return renderHome();
  }

  function renderHome() {
    var visible = S.activities.filter(function (a) {
      // An officer or head teacher sees submitted and published work,
      // never somebody else's unfinished draft.
      if (S.role === 'TEACHER') return true;
      return a.status !== 'DRAFT';
    });

    var pending = visible.filter(function (a) {
      return a.status === 'PENDING';
    });

    var html = '';
    html +=
      '<div><h1 class="screen__title">' +
      esc(S.role === 'TEACHER' ? t('tabHome') : t('reviewQueue')) +
      '</h1><p class="screen__sub">' +
      esc(t('school')) +
      ' · ' +
      esc(
        S.role === 'TEACHER'
          ? t('roleTeacherWho')
          : S.role === 'HEAD'
            ? t('roleHeadWho')
            : t('roleOfficerWho'),
      ) +
      '</p></div>';

    if (S.role !== 'TEACHER' && pending.length === 0) {
      html += '<p class="notice">' + esc(t('nothingToReview')) + '</p>';
    }

    var list = S.role === 'TEACHER' ? visible : pending.concat(
      visible.filter(function (a) {
        return a.status !== 'PENDING';
      }),
    );

    if (list.length === 0) {
      html += '<p class="empty">' + esc(t('noActivities')) + '</p>';
    }

    list.forEach(function (a) {
      html +=
        '<button class="card" type="button" data-open="' +
        a.id +
        '" style="text-align:start;cursor:pointer;display:block;width:100%">' +
        '<span class="rowline"><span><strong>' +
        esc(loc(a.title)) +
        '</strong><br><span class="faint">' +
        esc(fmtDate(a.date)) +
        '</span></span>' +
        statusTag(a) +
        '</span>' +
        (a.status === 'PUBLISHED'
          ? '<span class="tag tag--board" style="margin-top:.45rem">' +
            esc(t('vis' + a.visibility)) +
            '</span>'
          : '') +
        '</button>';
    });

    screenEl.innerHTML = html;
  }

  function renderDetail() {
    var act = S.activities.filter(function (a) {
      return a.id === S.open;
    })[0];
    if (!act) {
      S.open = null;
      return renderScreen();
    }

    var isAuthor = act.author === S.role;
    var html = '';

    html +=
      '<button class="btn btn--ghost btn--sm" type="button" data-back="1" style="align-self:flex-start">← ' +
      esc(t('back')) +
      '</button>';

    html +=
      '<div><h1 class="screen__title">' +
      esc(loc(act.title)) +
      '</h1><p class="screen__sub">' +
      esc(fmtDate(act.date)) +
      ' · ' +
      esc(t('author')) +
      ': ' +
      esc(t('roleTeacherWho')) +
      '</p></div>';

    html += '<div class="rowline">' + statusTag(act);
    if (act.status === 'PUBLISHED') {
      html += '<span class="tag tag--board">' + esc(t('vis' + act.visibility)) + '</span>';
    }
    html += '</div>';

    if (act.status === 'REJECTED' && act.reason) {
      html +=
        '<p class="notice notice--stop">' + esc(t('reject')) + ': ' + esc(act.reason) + '</p>';
    }

    html += '<div class="photo">' + illustration(act.photo) + '</div>';
    html += '<p style="white-space:pre-wrap">' + esc(loc(act.desc)) + '</p>';

    if (act.students.length) {
      html += '<div class="card"><p class="eyebrow">' + esc(t('recognised')) + '</p>';
      act.students.forEach(function (id) {
        var s = studentById(id);
        if (!s) return;
        html +=
          '<div class="rowline" style="margin-top:.4rem"><span>' +
          esc(loc(s.name)) +
          ' <span class="faint">' +
          esc(t('classLabel')) +
          ' ' +
          esc(s.cls) +
          '</span></span>' +
          consentTag(s) +
          '</div>';
      });
      html += '</div>';
    }

    if (act.reviewer) {
      html +=
        '<div class="register"><div class="register__row"><span><strong>' +
        esc(t('reviewedBy')) +
        '</strong> ' +
        esc(act.reviewer === 'HEAD' ? t('roleHeadWho') : t('roleOfficerWho')) +
        '</span><span>' +
        esc(fmtDate(act.reviewedOn)) +
        '</span></div></div>';
    }

    // --- Teacher: submit -------------------------------------------------
    if (isAuthor && (act.status === 'DRAFT' || act.status === 'REJECTED')) {
      html +=
        '<div class="card"><p class="eyebrow">' +
        esc(t('submitForReview')) +
        '</p>' +
        '<div class="field" style="margin-top:.4rem"><label for="req-vis">' +
        esc(t('requestedVisibility')) +
        '</label><select id="req-vis">' +
        ['SCHOOL', 'BLOCK', 'DISTRICT', 'PUBLIC']
          .map(function (v) {
            return (
              '<option value="' +
              v +
              '"' +
              (v === 'PUBLIC' ? ' selected' : '') +
              '>' +
              esc(t('vis' + v)) +
              '</option>'
            );
          })
          .join('') +
        '</select></div>' +
        '<button class="btn btn--primary btn--block" type="button" data-submit="' +
        act.id +
        '" style="margin-top:.6rem">' +
        esc(t('submitForReview')) +
        '</button></div>';
    }

    // --- Moderator: publish or reject ------------------------------------
    var isModerator = S.role === 'HEAD' || S.role === 'OFFICER';
    if (isModerator && act.status === 'PENDING') {
      if (isAuthor) {
        html += '<p class="notice notice--warn">' + esc(t('cannotSelfReview')) + '</p>';
      } else {
        var allowed = ['SCHOOL', 'BLOCK', 'DISTRICT', 'PUBLIC'].filter(function (v) {
          return canApprove(S.role, v);
        });
        var chosen = allowed.indexOf(act.requested) >= 0 ? act.requested : allowed[allowed.length - 1];

        html +=
          '<div class="card"><p class="eyebrow">' +
          esc(t('publish')) +
          '</p>' +
          '<p class="faint" style="margin-top:.2rem">' +
          esc(t('requestedVisibility')) +
          ': ' +
          esc(t('vis' + (act.requested || 'SCHOOL'))) +
          '</p>' +
          '<div class="field" style="margin-top:.4rem"><label for="pub-vis">' +
          esc(t('publishAt')) +
          '</label><select id="pub-vis">' +
          allowed
            .map(function (v) {
              return (
                '<option value="' +
                v +
                '"' +
                (v === chosen ? ' selected' : '') +
                '>' +
                esc(t('vis' + v)) +
                '</option>'
              );
            })
            .join('') +
          '</select></div>';

        if (S.role === 'HEAD') {
          html += '<p class="faint" style="margin-top:.35rem">' + esc(t('ceilingNote')) + '</p>';
        }

        html +=
          '<button class="btn btn--primary btn--block" type="button" data-publish="' +
          act.id +
          '" style="margin-top:.6rem">' +
          esc(t('publish')) +
          '</button>' +
          '<div id="blocker-slot"></div>' +
          '<div class="field" style="margin-top:.9rem"><label for="rej-reason">' +
          esc(t('rejectReason')) +
          '</label><input id="rej-reason" type="text" /></div>' +
          '<button class="btn btn--stop btn--block" type="button" data-reject="' +
          act.id +
          '" style="margin-top:.5rem">' +
          esc(t('reject')) +
          '</button></div>';
      }
    }

    screenEl.innerHTML = html;
  }

  function renderRoster() {
    var html =
      '<div><h1 class="screen__title">' +
      esc(t('tabRoster')) +
      '</h1><p class="screen__sub">' +
      esc(t('consentExplain')) +

    S.students.forEach(function (s) {
      html +=
        '<div class="card"><div class="rowline"><span><strong>' +
        esc(loc(s.name)) +
        '</strong><br><span class="faint">' +
        esc(t('classLabel')) +
        ' ' +
        esc(s.cls) +
        ' · ' +
        esc(t('guardianLabel')) +
        ': ' +
        esc(loc(s.guardian)) +
        '</span></span>' +
        consentTag(s) +
        '</div>';

      if (s.history.length) {
        html += '<div class="register" style="margin-top:.55rem">';
        s.history
          .slice()
          .reverse()
          .forEach(function (h) {
            html +=
              '<div class="register__row"><span><strong>' +
              esc(t('consent' + h.status)) +
              '</strong> · ' +
              esc(h.method === 'PAPER' ? t('methodPaper') : t('methodVerbal')) +
              '</span><span>' +
              esc(fmtDate(h.on)) +
              '</span></div>';
          });
        html += '</div>';
      }

      if (S.role === 'TEACHER' || S.role === 'HEAD') {
        if (s.consent === 'GRANTED') {
          html +=
            '<details style="margin-top:.55rem"><summary>' +
            esc(t('withdrawConsent')) +
            '</summary>' +
            '<p class="notice notice--warn" style="margin-top:.5rem">' +
            esc(t('withdrawWarn')) +
            '</p>' +
            '<div class="field" style="margin-top:.5rem"><label for="wd-' +
            s.id +
            '">' +
            esc(t('withdrawReason')) +
            '</label><input id="wd-' +
            s.id +
            '" type="text" /></div>' +
            '<button class="btn btn--stop btn--block" type="button" data-withdraw="' +
            s.id +
            '" style="margin-top:.5rem">' +
            esc(t('withdrawConsent')) +
            '</button></details>';
        } else {
          html +=
            '<button class="btn btn--block" type="button" data-consent="' +
            s.id +
            '" style="margin-top:.55rem">' +
            esc(t('recordConsent')) +
            '</button>';
        }
      }

      html += '</div>';
    });

    screenEl.innerHTML = html;
  }

  function renderShowcase() {
    var pub = S.activities.filter(function (a) {
      return a.status === 'PUBLISHED' && a.visibility === 'PUBLIC';
    });

    var html =
      '<div><h1 class="screen__title">' +
      esc(t('showcaseTitle')) +
      '</h1><p class="screen__sub">' +
      esc(t('showcaseSub')) +
      '</p></div>';

    if (!pub.length) {
      html += '<p class="empty">' + esc(t('showcaseEmpty')) + '</p>';
    }

    pub.forEach(function (a) {
      html +=
        '<div class="card"><div class="photo" style="margin-bottom:.6rem">' +
        illustration(a.photo) +
        '</div><h2 style="font-size:1.05rem">' +
        esc(loc(a.title)) +
        '</h2><p class="faint">' +
        esc(t('school')) +
        ' · ' +
        esc(fmtDate(a.date)) +
        '</p><p style="margin-top:.4rem;white-space:pre-wrap">' +
        esc(loc(a.desc)) +
        '</p><div style="display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem">';

      a.students.forEach(function (id) {
        var s = studentById(id);
        // Only children with consent in force, and only their given name.
        if (!s || s.consent !== 'GRANTED') return;
        html +=
          '<span class="tag tag--warn">' +
          esc(loc(s.given)) +
          ' · ' +
          esc(t('classLabel')) +
          ' ' +
          esc(s.cls) +
          '</span>';
      });

      html += '</div></div>';
    });

    if (pub.length) {
      html += '<p class="notice">' + esc(t('surnameNote')) + '</p>';
    }

    // Feedback lives on the last screen of the walkthrough.
    html +=
      '<div class="card"><p class="eyebrow">' +
      esc(t('feedbackLabel')) +
      '</p><p class="faint" style="margin:.2rem 0 .5rem">' +
      esc(t('feedbackHint')) +
      '</p><textarea id="notes">' +
      esc(S.notes) +
      '</textarea>' +
      '<button class="btn btn--block" type="button" id="copy-notes" style="margin-top:.5rem">' +
      esc(t('copyNotes')) +
      '</button></div>';

    screenEl.innerHTML = html;
  }

  // -------------------------------------------------------------------
  // Actions
  // -------------------------------------------------------------------
  function findActivity(id) {
    return S.activities.filter(function (a) {
      return a.id === id;
    })[0];
  }

  function submitActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    var sel = document.getElementById('req-vis');
    act.requested = sel ? sel.value : 'BLOCK';
    act.status = 'PENDING';
    act.reason = null;
    markDone('submit');
    toast(
      S.lang === 'hi'
        ? 'समीक्षा हेतु भेज दिया गया। अब प्रधानाध्यापक या जनपद अधिकारी बनकर देखिए।'
        : 'Sent for review. Now switch to the head teacher or district officer.',
    );
    render();
  }

  function publishActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    var sel = document.getElementById('pub-vis');
    var vis = sel ? sel.value : 'SCHOOL';

    var problems = blockers(act, vis, S.role);
    if (problems.length) {
      S.why = 'blocked';
      if (vis === 'PUBLIC') markDone('blocked');
      renderWhy();
      renderSteps();
      save();
      showBlockers(problems);
      return;
    }

    act.status = 'PUBLISHED';
    act.visibility = vis;
    act.reviewer = S.role;
    act.reviewedOn = new Date().toISOString().slice(0, 10);
    act.reason = null;

    if (vis === 'PUBLIC') {
      markDone('published');
      toast(
        S.lang === 'hi'
          ? 'सार्वजनिक रूप से प्रकाशित। अब प्रदर्शनी खोलकर देखिए।'
          : 'Published publicly. Now open the showcase.',
      );
    } else {
      S.why = 'ceiling';
      markDone('ceiling');
      toast(
        S.lang === 'hi'
          ? 'प्रकाशित — पर केवल ' + t('vis' + vis) + ' तक।'
          : 'Published — but only at ' + t('vis' + vis) + '.',
      );
    }
    S.open = null;
    render();
  }

  function showBlockers(problems) {
    // A toast left over from an earlier step would sit on top of the refusal
    // and contradict it.
    var stale = document.querySelector('.toast');
    if (stale) stale.remove();
    clearTimeout(toastTimer);

    var box = document.createElement('div');
    box.className = 'notice notice--stop';
    box.setAttribute('role', 'alert');
    box.style.marginTop = '.6rem';
    box.innerHTML =
      '<strong>' +
      esc(t('blockers')) +
      '</strong><ul style="margin:.35rem 0 0;padding-inline-start:1.1rem;font-weight:500">' +
      problems
        .map(function (p) {
          return '<li>' + esc(blockerText(p)) + '</li>';
        })
        .join('') +
      '</ul>';
    var slot = document.getElementById('blocker-slot');
    (slot || screenEl).appendChild(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function rejectActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    var input = document.getElementById('rej-reason');
    var reason = input ? input.value.trim() : '';
    if (reason.length < 3) {
      S.why = 'rejected';
      renderWhy();
      toast(
        S.lang === 'hi'
          ? 'कारण लिखे बिना अस्वीकार नहीं किया जा सकता।'
          : 'You cannot reject without giving a reason.',
      );
      return;
    }
    act.status = 'REJECTED';
    act.reason = reason;
    act.reviewer = S.role;
    act.reviewedOn = new Date().toISOString().slice(0, 10);
    S.why = 'rejected';
    S.open = null;
    render();
  }

  function recordConsent(id) {
    var s = studentById(id);
    if (!s) return;
    s.consent = 'GRANTED';
    s.history.push({
      status: 'GRANTED',
      method: 'PAPER',
      by: S.role,
      on: new Date().toISOString().slice(0, 10),
    });
    markDone('consent');
    toast(
      S.lang === 'hi'
        ? 'सहमति दर्ज हो गई। अब जनपद अधिकारी बनकर फिर से प्रकाशित कीजिए।'
        : 'Consent recorded. Now switch to the district officer and publish again.',
    );
    render();
  }

  function withdrawConsent(id) {
    var s = studentById(id);
    if (!s) return;
    var input = document.getElementById('wd-' + id);
    var reason = input ? input.value.trim() : '';
    if (reason.length < 3) {
      toast(S.lang === 'hi' ? 'कृपया कारण लिखिए।' : 'Please give a reason.');
      return;
    }
    s.consent = 'REVOKED';
    s.history.push({
      status: 'REVOKED',
      method: 'PAPER',
      by: S.role,
      on: new Date().toISOString().slice(0, 10),
    });

    // The rule that matters: withdrawal reaches everything already published,
    // in the same action, not in a queue.
    var pulled = 0;
    S.activities.forEach(function (a) {
      if (
        a.status === 'PUBLISHED' &&
        a.visibility === 'PUBLIC' &&
        a.students.indexOf(id) >= 0
      ) {
        a.visibility = 'DISTRICT';
        pulled++;
      }
    });

    markDone('withdrawn');
    toast(
      pulled
        ? S.lang === 'hi'
          ? pulled + ' सार्वजनिक गतिविधि तुरंत हटा दी गई।'
          : pulled + ' public activity removed immediately.'
        : S.lang === 'hi'
          ? 'सहमति वापस ले ली गई।'
          : 'Consent withdrawn.',
    );
    render();
  }

  // -------------------------------------------------------------------
  // Wiring
  // -------------------------------------------------------------------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-role],[data-tab],[data-open],[data-back],[data-submit],[data-publish],[data-reject],[data-consent],[data-withdraw],#copy-notes') : null;
    if (!el) return;

    if (el.dataset.role) {
      S.role = el.dataset.role;
      S.open = null;
      if (S.tab === 'roster' && S.role === 'OFFICER') S.tab = 'home';
      // Reaching the review queue as a head teacher is itself the moment
      // the ceiling becomes visible.
      if (S.role === 'HEAD' && S.activities.some(function (a) { return a.status === 'PENDING'; })) {
        S.why = 'ceiling';
      }
      return render();
    }
    if (el.dataset.tab) {
      S.tab = el.dataset.tab;
      S.open = null;
      if (S.tab === 'showcase') {
        var anyPublic = S.activities.some(function (a) {
          return a.status === 'PUBLISHED' && a.visibility === 'PUBLIC';
        });
        if (anyPublic) {
          markDone('showcase');
        }
      }
      return render();
    }
    if (el.dataset.open) {
      S.open = el.dataset.open;
      var act = findActivity(S.open);
      if (act && act.status === 'PENDING' && act.author === S.role && S.role !== 'TEACHER') {
        S.why = 'selfreview';
      }
      return render();
    }
    if (el.dataset.back) {
      S.open = null;
      return render();
    }
    if (el.dataset.submit) return submitActivity(el.dataset.submit);
    if (el.dataset.publish) return publishActivity(el.dataset.publish);
    if (el.dataset.reject) return rejectActivity(el.dataset.reject);
    if (el.dataset.consent) return recordConsent(el.dataset.consent);
    if (el.dataset.withdraw) return withdrawConsent(el.dataset.withdraw);

    if (el.id === 'copy-notes') {
      var area = document.getElementById('notes');
      S.notes = area ? area.value : '';
      save();
      var payload =
        'BalSanskar demo — ' +
        new Date().toLocaleString() +
        '\nRole: ' +
        S.role +
        '\nLanguage: ' +
        S.lang +
        '\nSteps completed: ' +
        Object.keys(S.done).join(', ') +
        '\n\n' +
        S.notes;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(
          function () {
            toast(t('copied'));
          },
          function () {
            toast(t('copyFailed'));
          },
        );
      } else {
        toast(t('copyFailed'));
      }
    }
  });

  document.getElementById('lang-toggle').addEventListener('click', function () {
    S.lang = S.lang === 'hi' ? 'en' : 'hi';
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    var lang = S.lang;
    S = seed();
    S.lang = lang;
    render();
  });

  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'notes') {
      S.notes = ev.target.value;
    }
  });

  render();
</script>

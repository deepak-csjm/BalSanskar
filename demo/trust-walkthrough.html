<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap"
/>

<style>
  /* ---------------------------------------------------------------------
     BalSanskar — consent walkthrough

     Palette taken from the schools themselves: the deep green of a
     blackboard and the turmeric ochre of a Basic Shiksha building, on the
     warm paper of a school register. Greys are biased green so they sit in
     the same family rather than reading as default UI grey.
     --------------------------------------------------------------------- */

  :root {
    --board: #1b4b3e;
    --board-deep: #123329;
    --board-tint: #e4ede9;
    --haldi: #c4791f;
    --haldi-tint: #fbf0dd;
    --ok: #1b6b4a;
    --ok-tint: #e2efe8;
    --stop: #a32f28;
    --stop-tint: #fae9e8;

    --paper: #fbf9f4;
    --surface: #ffffff;
    --sunk: #f2efe6;
    --rule: #e0dccf;
    --rule-strong: #cdc7b5;

    --ink: #1a1b18;
    --ink-soft: #565a52;
    --ink-faint: #83887c;

    --shadow: 0 1px 2px rgb(26 27 24 / 7%), 0 6px 20px rgb(26 27 24 / 6%);
    --shadow-lift: 0 10px 40px rgb(18 51 41 / 18%);

    --sans: 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Noto Serif Devanagari', Georgia, serif;

    --r-sm: 8px;
    --r: 12px;
    --r-lg: 18px;
    --tap: 48px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --board: #2f7a64;
      --board-deep: #256052;
      --board-tint: #1d2c27;
      --haldi: #e0a253;
      --haldi-tint: #2e2417;
      --ok: #5cb98f;
      --ok-tint: #16291f;
      --stop: #e08a83;
      --stop-tint: #2d1b19;

      --paper: #14160f;
      --surface: #1c1f19;
      --sunk: #23271f;
      --rule: #333829;
      --rule-strong: #454b3b;

      --ink: #f0eee5;
      --ink-soft: #b3b6a9;
      --ink-faint: #878b7d;

      --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
      --shadow-lift: 0 10px 40px rgb(0 0 0 / 50%);
    }
  }

  :root[data-theme='dark'] {
    --board: #2f7a64;
    --board-deep: #256052;
    --board-tint: #1d2c27;
    --haldi: #e0a253;
    --haldi-tint: #2e2417;
    --ok: #5cb98f;
    --ok-tint: #16291f;
    --stop: #e08a83;
    --stop-tint: #2d1b19;

    --paper: #14160f;
    --surface: #1c1f19;
    --sunk: #23271f;
    --rule: #333829;
    --rule-strong: #454b3b;

    --ink: #f0eee5;
    --ink-soft: #b3b6a9;
    --ink-faint: #878b7d;

    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
    --shadow-lift: 0 10px 40px rgb(0 0 0 / 50%);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    /* Devanagari needs more vertical room than Latin to stay legible. */
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
  }

  h1,
  h2,
  h3 {
    font-family: var(--serif);
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
  }

  p {
    margin: 0;
  }

  a {
    color: var(--board);
  }

  button {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--haldi);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* --- Page frame ---------------------------------------------------- */

  .demo-banner {
    background: var(--haldi);
    color: #22160a;
    font-size: 0.8rem;
    font-weight: 600;
    text-align: center;
    padding: 0.5rem 1rem;
    line-height: 1.45;
  }

  .stage {
    display: grid;
    gap: 1.5rem;
    grid-template-columns: 1fr;
    align-items: start;
    max-width: 62rem;
    margin: 0 auto;
    padding-inline: 1rem;
    padding-block: 1.25rem 3rem;
  }

  @media (min-width: 62rem) {
    .stage {
      grid-template-columns: 24rem 1fr;
      gap: 2.5rem;
      padding-block: 2.5rem 4rem;
    }
  }

  /* The handset. On a phone it disappears and the app fills the screen —
     a bezel drawn around a real phone would be absurd. */
  .handset {
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--rule);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 34rem;
  }

  @media (min-width: 62rem) {
    .handset {
      border-radius: 26px;
      border: 8px solid #22251d;
      box-shadow: var(--shadow-lift);
      position: sticky;
      top: 1.5rem;
      height: 46rem;
      min-height: 0;
    }
  }

  .app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    background: var(--paper);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 0.9rem;
    background: var(--board);
    color: #fff;
    flex: none;
  }

  .topbar__brand {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1rem;
    margin-inline-end: auto;
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .topbar__brand small {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 0.68rem;
    opacity: 0.78;
  }

  .chip-btn {
    background: rgb(255 255 255 / 14%);
    border: 1px solid rgb(255 255 255 / 26%);
    color: #fff;
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 32px;
  }

  .chip-btn:hover {
    background: rgb(255 255 255 / 24%);
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .tabbar {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    flex: none;
  }

  .tabbar button {
    flex: 1;
    background: none;
    border: none;
    border-top: 3px solid transparent;
    padding: 0.45rem 0.2rem 0.55rem;
    min-height: var(--tap);
    font-size: 0.68rem;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .tabbar button[aria-current='page'] {
    color: var(--board);
    border-top-color: var(--board);
    font-weight: 700;
  }

  .tabbar svg {
    width: 20px;
    height: 20px;
  }

  /* --- App surfaces --------------------------------------------------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 0.85rem;
  }

  .card--flat {
    box-shadow: none;
  }

  .screen__title {
    font-size: 1.25rem;
  }

  .screen__sub {
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  .rowline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
  }

  .muted {
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  .faint {
    color: var(--ink-faint);
    font-size: 0.76rem;
  }

  .eyebrow {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--sunk);
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .tag--ok {
    background: var(--ok-tint);
    color: var(--ok);
  }
  .tag--warn {
    background: var(--haldi-tint);
    color: var(--haldi);
  }
  .tag--stop {
    background: var(--stop-tint);
    color: var(--stop);
  }
  .tag--board {
    background: var(--board-tint);
    color: var(--board);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: var(--tap);
    padding: 0.5rem 0.9rem;
    border-radius: var(--r-sm);
    border: 1.5px solid transparent;
    background: var(--sunk);
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }

  .btn--primary {
    background: var(--board);
    color: #fff;
  }
  .btn--primary:hover:not(:disabled) {
    background: var(--board-deep);
  }
  .btn--stop {
    background: var(--stop);
    color: #fff;
  }
  .btn--ghost {
    background: transparent;
    border-color: var(--rule-strong);
  }
  .btn--block {
    width: 100%;
  }
  .btn--sm {
    min-height: 36px;
    padding: 0.25rem 0.6rem;
    font-size: 0.8rem;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .field > label {
    font-weight: 600;
    font-size: 0.85rem;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-height: 44px;
    padding: 0.5rem 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--rule-strong);
    border-radius: var(--r-sm);
  }

  textarea {
    min-height: 5.5rem;
    resize: vertical;
  }

  .notice {
    border-radius: var(--r-sm);
    padding: 0.65rem 0.75rem;
    font-size: 0.85rem;
    border: 1px solid var(--rule);
    background: var(--sunk);
  }

  .notice--stop {
    background: var(--stop-tint);
    border-color: var(--stop);
    color: var(--stop);
    font-weight: 600;
  }
  .notice--ok {
    background: var(--ok-tint);
    border-color: var(--ok);
    color: var(--ok);
    font-weight: 600;
  }
  .notice--warn {
    background: var(--haldi-tint);
    border-color: var(--haldi);
    color: #7a4a11;
  }

  :root[data-theme='dark'] .notice--warn,
  :root:not([data-theme='light']) .notice--warn {
    color: var(--haldi);
  }

  .checkline {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    min-height: 42px;
    padding: 0.2rem 0;
    font-size: 0.9rem;
  }

  .checkline input {
    width: 20px;
    min-height: 20px;
    height: 20px;
    margin-top: 0.5rem;
    flex: none;
  }

  .photo {
    border-radius: var(--r-sm);
    overflow: hidden;
    background: var(--sunk);
    aspect-ratio: 4 / 3;
    display: block;
    width: 100%;
  }

  .photo svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* --- The register: consent history and endorsements ------------------ */

  .register {
    border: 1px solid var(--rule-strong);
    border-radius: var(--r-sm);
    background: repeating-linear-gradient(var(--surface) 0 1.85rem, var(--rule) 1.85rem 1.9rem);
    padding: 0.1rem 0.7rem;
  }

  .register__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    height: 1.9rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .register__row strong {
    color: var(--ink);
    font-weight: 600;
  }

  .stamp {
    display: inline-block;
    border: 2px solid var(--ok);
    color: var(--ok);
    border-radius: 4px;
    padding: 0.1rem 0.45rem;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transform: rotate(-3deg);
  }

  .stamp--stop {
    border-color: var(--stop);
    color: var(--stop);
  }

  /* --- Guidance rail --------------------------------------------------- */

  .rail {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 1.1rem;
    box-shadow: var(--shadow);
  }

  .panel h2 {
    font-size: 1.1rem;
    margin-bottom: 0.35rem;
  }

  .panel > * + * {
    margin-top: 0.6rem;
  }

  .roles {
    display: grid;
    gap: 0.5rem;
    grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
  }

  .role {
    text-align: start;
    border: 1.5px solid var(--rule-strong);
    background: var(--surface);
    border-radius: var(--r-sm);
    padding: 0.6rem 0.7rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: var(--tap);
  }

  .role[aria-pressed='true'] {
    border-color: var(--board);
    background: var(--board-tint);
    box-shadow: inset 0 0 0 1px var(--board);
  }

  .role strong {
    font-size: 0.9rem;
  }

  /* The walkthrough is a real sequence, so it is numbered. */
  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .step {
    display: grid;
    grid-template-columns: 1.6rem 1fr;
    gap: 0.6rem;
    padding: 0.45rem 0;
    border-top: 1px solid var(--rule);
    font-size: 0.87rem;
    color: var(--ink-soft);
    align-items: start;
  }

  .step:first-child {
    border-top: none;
  }

  .step__n {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--ink-faint);
    border: 1.5px solid var(--rule-strong);
    border-radius: 50%;
    width: 1.6rem;
    height: 1.6rem;
    display: grid;
    place-items: center;
    line-height: 1;
  }

  .step--done .step__n {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }

  .step--now {
    color: var(--ink);
    font-weight: 600;
  }

  .step--now .step__n {
    border-color: var(--haldi);
    color: var(--haldi);
    box-shadow: 0 0 0 3px var(--haldi-tint);
  }

  .why {
    border-inline-start: 3px solid var(--board);
    background: var(--board-tint);
    padding: 0.6rem 0.8rem;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: 0.87rem;
  }

  .why strong {
    display: block;
    font-family: var(--serif);
  }

  .disclosure {
    border-top: 1px solid var(--rule);
    padding-top: 0.6rem;
  }

  summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    min-height: 32px;
  }

  .toast {
    position: fixed;
    inset-inline: 1rem;
    bottom: 1rem;
    max-width: 28rem;
    margin-inline: auto;
    background: var(--board-deep);
    color: #fff;
    padding: 0.7rem 0.9rem;
    border-radius: var(--r-sm);
    font-size: 0.87rem;
    box-shadow: var(--shadow-lift);
    z-index: 50;
    animation: rise 0.18s ease-out;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 2rem 1rem;
    font-size: 0.9rem;
  }
</style>


<style>
  /* Additions for the two tracks and the block officer's queue. */

  .tracks {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .track {
    flex: 1 1 10rem;
    text-align: start;
    border: 1.5px solid var(--rule-strong);
    background: var(--surface);
    border-radius: var(--r-sm);
    padding: 0.5rem 0.7rem;
    cursor: pointer;
    min-height: var(--tap);
    font-size: 0.86rem;
    line-height: 1.35;
  }

  .track[aria-pressed='true'] {
    border-color: var(--board);
    background: var(--board-tint);
    box-shadow: inset 0 0 0 1px var(--board);
    font-weight: 650;
  }

  .track small {
    display: block;
    font-weight: 400;
    color: var(--ink-faint);
    font-size: 0.74rem;
  }

  /* The risk queue. A severity stripe so what needs attention reads at a
     glance, rather than a wall of identically-weighted cards. */
  .risk {
    border-inline-start: 4px solid var(--rule-strong);
    padding-inline-start: 0.6rem;
  }
  .risk--high {
    border-inline-start-color: var(--stop);
  }
  .risk--medium {
    border-inline-start-color: var(--haldi);
  }
  .risk--low {
    border-inline-start-color: var(--ok);
  }

  .risk__score {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .flaglist {
    margin: 0.4rem 0 0;
    padding-inline-start: 1.05rem;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .flaglist li + li {
    margin-top: 0.15rem;
  }

  /* The attestation. Set apart from the rest of the form, because signing it
     is a different kind of act from filling a field in. */
  .attestation {
    border: 2px solid var(--board);
    border-radius: var(--r-sm);
    background: var(--board-tint);
    padding: 0.75rem;
  }

  .attestation p {
    font-size: 0.87rem;
    line-height: 1.6;
  }

  .meter {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .meter strong {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
</style>

<script>
  'use strict';

  /* =====================================================================
     BalSanskar — how a school joins, and how its work gets out

     A demonstration of two things the platform has to get right:

       1. How 130,000 schools get onto a platform nobody has time to type
          them into, without letting a stranger claim one.
       2. What has to be true before a school's work is seen outside that
          school — given that a head teacher signing off a colleague's work
          in a three-teacher school is not an independent check on anything.

     Two things this is NOT:
       - It is not the real system. Every rule below runs in this browser;
         in the platform they run on the server and in the database, which
         is the copy that counts.
       - It holds no real data. The schools, teachers and children here are
         invented, nothing is uploaded, and nothing leaves this device.
     ===================================================================== */

  var STORE_KEY = 'balsanskar.demo.v2';

  // -------------------------------------------------------------------
  // Copy. Hindi first, because that is the language these schools work in.
  // -------------------------------------------------------------------
  var COPY = {
    hi: {
      banner:
        'प्रदर्शन संस्करण — यह वास्तविक प्रणाली नहीं है। कृपया किसी असली बच्चे का नाम या फ़ोटो दर्ज न करें।',
      langBtn: 'EN',
      reset: 'फिर से',
      railEyebrow: 'आज़माकर देखिए',

  function ceiling(role) {
    if (role === 'DISTRICT') return 'PUBLIC';

  /**
   * Everything about this activity a human might want to look at before it
   * leaves the school. Each check is cheap and each one is fallible: none of
   * them rejects anything, they decide where attention goes.

  function assessRisk(act) {
    var flags = [];

    // The cheap fraud is recycling a photograph, so this is the check worth
    // having — and the strongest single signal when it fires.
    for (var i = 0; i < S.knownPhotos.length; i++) {
      var known = S.knownPhotos[i];
      if (known.id === act.photoId) {
        flags.push({
          code: known.school === 'OTHER' ? 'PHOTO_REUSED_OTHER_SCHOOL' : 'PHOTO_REUSED_OWN_SCHOOL',
          weight: known.school === 'OTHER' ? 50 : 25,
          on: known.on,
        });
      }
    }

    var roster = S.students.length;
    if (act.participants && roster > 0 && act.participants > roster) {
      flags.push({ code: 'COUNT_EXCEEDS_ROSTER', weight: 30, n: act.participants, roster: roster });
    }

    var day = new Date(act.date + 'T00:00:00Z').getUTCDay();
    if (day === 0) flags.push({ code: 'NON_WORKING_DAY', weight: 5 });

    var noConsent = act.students.filter(function (id) {
      var s = studentById(id);
      return !s || s.consent !== 'GRANTED';
    }).length;
    if (noConsent > 0) flags.push({ code: 'CONSENT_GAPS', weight: 15, n: noConsent });

    if (S.school.cleared === 0) flags.push({ code: 'FIRST_SUBMISSION', weight: 5 });

    var score = flags.reduce(function (sum, f) {
      return sum + f.weight;
    }, 0);
    return { flags: flags, score: score };
  }

  // -------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------
  var screenEl = document.getElementById('screen');
  var toastTimer = null;

  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.remove();
    }, 4200);
  }

  function clearToast() {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    clearTimeout(toastTimer);
  }

  function markDone(id) {
    S.done[id] = true;
    S.why = id;
  }

  function render() {
    document.documentElement.lang = S.lang;
    document.getElementById('banner').textContent = t('banner');
    document.getElementById('lang-toggle').textContent = t('langBtn');
    document.getElementById('reset').textContent = t('reset');
    document.getElementById('topbar-sub').textContent =
      S.role === 'CLAIMANT' ? '—' : loc(S.school.name);
    document.getElementById('rail-eyebrow').textContent = t('railEyebrow');
    document.getElementById('rail-title').textContent = t('railTitle');
    document.getElementById('rail-intro').textContent = t('railIntro');
    document.getElementById('role-note').textContent = t('roleNote');
    document.getElementById('why-title').textContent = t('whyTitle');
    document.getElementById('about-summary').textContent = t('aboutSummary');
    document.getElementById('about-body').innerHTML = t('aboutBody');

    renderTracks();
    renderRoles();
    renderSteps();
    renderWhy();
    renderTabs();
    renderScreen();
    save();
  }

  function renderTracks() {
    var tracks = [
      { id: 'join', name: t('trackJoin'), sub: t('trackJoinSub') },
      { id: 'out', name: t('trackOut'), sub: t('trackOutSub') },
    ];
    document.getElementById('tracks').innerHTML = tracks
      .map(function (track) {
        return (
          '<button class="track" type="button" data-track="' +
          track.id +
          '" aria-pressed="' +
          (S.track === track.id) +
          '">' +
          esc(track.name) +
          '<small>' +
          esc(track.sub) +
          '</small></button>'
        );
      })
      .join('');
  }

  function renderRoles() {
    // Only the roles the chosen track actually needs, so the chip row does not
    // become a menu of five people nobody is playing.
    var roles =
      S.track === 'join'
        ? [
            { id: 'CLAIMANT', name: t('roleClaimant'), who: t('roleClaimantWho') },
            { id: 'BLOCK', name: t('roleBlock'), who: t('roleBlockWho') },
          ]
        : [
            { id: 'TEACHER', name: t('roleTeacher'), who: t('roleTeacherWho') },
            { id: 'HEAD', name: t('roleHead'), who: t('roleHeadWho') },
            { id: 'BLOCK', name: t('roleBlock'), who: t('roleBlockWho') },
            { id: 'DISTRICT', name: t('roleDistrict'), who: t('roleDistrictWho') },
          ];
    document.getElementById('roles').innerHTML = roles
      .map(function (r) {
        return (
          '<button class="role" type="button" data-role="' +
          r.id +
          '" aria-pressed="' +
          (S.role === r.id) +
          '"><strong>' +
          esc(r.name) +
          '</strong><span class="faint">' +
          esc(r.who) +
          '</span></button>'
        );
      })
      .join('');
  }

  function renderSteps() {
    var list = TRACKS[S.track][S.lang];
    document.getElementById('steps-title').textContent =
      S.track === 'join' ? t('trackJoin') : t('trackOut');

    var nextIndex = list.length;
    for (var i = 0; i < list.length; i++) {
      if (!S.done[list[i].id]) {
        nextIndex = i;
        break;
      }
    }
    document.getElementById('steps').innerHTML = list
      .map(function (step, i) {
        var cls = S.done[step.id] ? 'step step--done' : i === nextIndex ? 'step step--now' : 'step';
        return (
          '<li class="' +
          cls +
          '"><span class="step__n" aria-hidden="true">' +
          (S.done[step.id] ? '✓' : i + 1) +
          '</span><span>' +
          esc(step.text) +
          '</span></li>'
        );
      })
      .join('');
  }

  function renderWhy() {
    var w = WHY[S.lang][S.why] || WHY[S.lang].welcome;
    document.getElementById('why-body').innerHTML =
      '<div class="why"><strong>' + esc(w.h) + '</strong>' + esc(w.p) + '</div>';
  }

  function renderTabs() {
    var tabs = [];
    if (S.role === 'CLAIMANT') {
      tabs = [{ id: 'claim', label: t('claimTitle'), ic: 'claims' }];
    } else if (S.role === 'BLOCK') {
      tabs = [
        { id: 'claims', label: t('tabClaims'), ic: 'claims' },
        { id: 'queue', label: t('tabQueue'), ic: 'queue' },
        { id: 'showcase', label: t('tabShowcase'), ic: 'showcase' },
      ];
    } else if (S.role === 'DISTRICT') {
      tabs = [
        { id: 'home', label: t('tabHome'), ic: 'home' },
        { id: 'showcase', label: t('tabShowcase'), ic: 'showcase' },
      ];
    } else {
      tabs = [
        { id: 'home', label: t('tabHome'), ic: 'home' },
        { id: 'roster', label: t('tabRoster'), ic: 'roster' },
        { id: 'showcase', label: t('tabShowcase'), ic: 'showcase' },
      ];
    }
    var valid = tabs.some(function (tab) {
      return tab.id === S.tab;
    });
    if (!valid) S.tab = tabs[0].id;

    document.getElementById('tabbar').innerHTML = tabs
      .map(function (tab) {
        return (
          '<button type="button" data-tab="' +
          tab.id +
          '"' +
          (S.tab === tab.id ? ' aria-current="page"' : '') +
          '>' +
          icon(tab.ic) +
          '<span>' +
          esc(tab.label) +
          '</span></button>'
        );
      })
      .join('');
  }

  function statusTag(act) {
    var cls = {
      DRAFT: 'tag',
      PENDING: 'tag tag--warn',
      PUBLISHED: 'tag tag--ok',
      REJECTED: 'tag tag--stop',
    }[act.status];
    return '<span class="' + cls + '">' + esc(t('status' + act.status)) + '</span>';
  }

  function clearanceTag(act) {
    if (act.clearance === 'NOT_REQUIRED') return '';
    var cls = {
      AWAITING_BLOCK: 'tag tag--warn',
      AUTO_CLEARED: 'tag tag--board',
      CLEARED: 'tag tag--ok',
      RETURNED: 'tag tag--stop',
    }[act.clearance];
    return '<span class="' + cls + '">' + esc(t('clear' + act.clearance)) + '</span>';
  }

  function consentTag(student) {
    var key = student.consent || 'NONE';
    var cls = {
      GRANTED: 'tag tag--ok',
      DENIED: 'tag tag--stop',
      REVOKED: 'tag tag--stop',
      NONE: 'tag tag--warn',
    }[key];
    return '<span class="' + cls + '">' + esc(t('consent' + key)) + '</span>';
  }

  function tierTag() {
    var cls = {
      NEW: 'tag tag--warn',
      STANDARD: 'tag',
      TRUSTED: 'tag tag--ok',
      WATCH: 'tag tag--stop',
    }[S.school.tier];
    return '<span class="' + cls + '">' + esc(t('tier' + S.school.tier)) + '</span>';
  }

  function renderScreen() {
    if (S.role === 'CLAIMANT') return renderClaim();
    if (S.open) return renderDetail();
    if (S.tab === 'claims') return renderClaimsQueue();
    if (S.tab === 'queue') return renderClearanceQueue();
    if (S.tab === 'roster') return renderRoster();
    if (S.tab === 'showcase') return renderShowcase();
    return renderHome();
  }

  // --- Track two: work leaving the school -------------------------------

  function renderHome() {
    var visible = S.activities.filter(function (a) {
      if (S.role === 'TEACHER' || S.role === 'HEAD') return true;
      // An officer sees what has actually reached their level.
      return VIS_RANK[a.visibility] >= (S.role === 'DISTRICT' ? VIS_RANK.DISTRICT : VIS_RANK.BLOCK);
    });

    var html =
      '<div><h1 class="screen__title">' +
      esc(t('tabHome')) +
      '</h1><p class="screen__sub">' +
      esc(loc(S.school.name)) +
      ' · ' +
      esc(
        S.role === 'TEACHER'
          ? t('roleTeacherWho')
          : S.role === 'HEAD'
            ? t('roleHeadWho')
            : t('roleDistrictWho'),
      ) +
      '</p></div>';

    if (S.role === 'HEAD') {
      html += renderTrustCard();
    }

    if (visible.length === 0) {
      html += '<p class="empty">' + esc(t('noActivities')) + '</p>';
    }

    visible.forEach(function (a) {
      html +=
        '<button class="card" type="button" data-open="' +
        a.id +
        '" style="text-align:start;cursor:pointer;display:block;width:100%">' +
        '<span class="rowline"><span><strong>' +
        esc(loc(a.title)) +
        '</strong><br><span class="faint">' +
        esc(fmtDate(a.date)) +
        '</span></span>' +
        statusTag(a) +
        '</span>' +
        '<span class="row" style="margin-top:.45rem">' +
        '<span class="tag tag--board">' +
        esc(t('vis' + a.visibility)) +
        '</span>' +
        clearanceTag(a) +
        '</span></button>';
    });

    screenEl.innerHTML = html;
  }

    var rate = Math.round(SAMPLE_RATE[S.school.tier] * 100);
    return (
      '<div class="card"><div class="rowline"><span class="eyebrow">' +
      esc(t('trustTitle')) +
      '</span>' +
      tierTag() +
      '</div>' +
      '<div class="row" style="margin-top:.4rem;gap:1rem">' +
      '<span class="meter">' +
      esc(t('trustCleared')) +
      ' <strong>' +
      S.school.cleared +
      '</strong></span>' +
      '<span class="meter">' +
      esc(t('trustReturned')) +
      ' <strong>' +
      S.school.returned +
      '</strong></span>' +
      '<span class="meter">' +
      esc(t('trustSample')) +
      ' <strong>' +
      rate +
      '%</strong></span>' +
      '</div></div>'
    );
  }

    var act = S.activities.filter(function (a) {
      return a.id === S.open;
    })[0];
    if (!act) {
      S.open = null;
      return renderScreen();

    var html = '';

      '<button class="btn btn--ghost btn--sm" type="button" data-back="1" style="align-self:flex-start">← ' +
      esc(t('back')) +

    html +=
      '<div><h1 class="screen__title">' +
      esc(loc(act.title)) +

          consentTag(s) +

        esc(S.lang === 'hi' ? 'प्रमाणित' : 'Attested') +

        '</p></div>';

      html +=
        '<div class="card"><p class="eyebrow">' +
        esc(t('requestedVisibility')) +
        '</p>' +
        '<select id="target" style="margin-top:.3rem">' +
        ['BLOCK', 'DISTRICT']
          .map(function (v) {
            return '<option value="' + v + '">' + esc(t('vis' + v)) + '</option>';
          })
          .join('') +
        '</select>';

      html +=
        '<div class="attestation" style="margin-top:.7rem"><p class="eyebrow">' +
        esc(t('attestTitle')) +
        '</p><p>' +
        esc(t('attestBody')) +
        '</p>' +
        '<label class="checkline"><input type="checkbox" id="attest" /><span>' +
        esc(t('attestConfirm')) +
        '</span></label></div>';

      html +=
        '<button class="btn btn--primary btn--block" type="button" data-send-on="' +
        act.id +
        '" style="margin-top:.6rem">' +
        esc(t('publish')) +
        '</button>' +
        '<div id="blocker-slot"></div></div>';
    }

    // --- District: to the open web ---------------------------------------
    if (S.role === 'DISTRICT' && act.status === 'PUBLISHED' && act.visibility !== 'PUBLIC') {
      html +=
        '<div class="card"><button class="btn btn--primary btn--block" type="button" data-make-public="' +
        act.id +
        '">' +
        esc(t('visPUBLIC')) +
        '</button><div id="blocker-slot"></div></div>';
    }

    screenEl.innerHTML = html;
  }

  function renderClearanceQueue() {
    var pending = S.activities.filter(function (a) {
      return a.clearance === 'AWAITING_BLOCK';
    });
    // Ordered by risk, not by arrival: the first screen shows what is most
    // likely to be wrong.
    pending.sort(function (a, b) {
      return b.score - a.score;
    });

    var html = '<div><h1 class="screen__title">' + esc(t('queueTitle')) + '</h1></div>';

    if (pending.length === 0) {
      html += '<p class="empty">' + esc(t('queueEmpty')) + '</p>';
      screenEl.innerHTML = html;
      return;
    }

    pending.forEach(function (act) {
      var severity = act.score >= 40 ? 'high' : act.score >= 15 ? 'medium' : 'low';
      html +=
        '<div class="card"><div class="risk risk--' +
        severity +
        '"><div class="rowline"><div><strong>' +
        esc(loc(act.title)) +
        '</strong><br><span class="faint">' +
        esc(loc(S.school.name)) +
        ' · ' +
        esc(fmtDate(act.date)) +
        '</span></div>' +
        '<div style="text-align:end"><div class="risk__score">' +
        act.score +
        '</div><div class="faint">' +
        esc(t('riskScore')) +
        '</div></div></div>';

      html +=
        '<div class="row" style="margin-top:.4rem">' +
        '<span class="tag ' +
        (act.risk.length ? 'tag--stop' : 'tag--board') +
        '">' +
        esc(act.risk.length ? t('reasonFLAGGED') : t('reasonSAMPLED')) +
        '</span>' +
        tierTag() +
        '<span class="tag">' +
        esc(t('vis' + (act.target || 'BLOCK'))) +
        '</span></div>';

      if (act.risk.length) {
        html +=
          '<p class="eyebrow" style="margin-top:.5rem">' +
          esc(t('queueWhy')) +
          '</p><ul class="flaglist">' +
          act.risk
            .map(function (f) {
              return '<li>' + esc(flagText(f)) + '</li>';
            })
            .join('') +
          '</ul>';
      }

      if (act.attestedBy) {
        html +=
          '<div class="register" style="margin-top:.5rem"><div class="register__row"><span><strong>' +
          esc(t('attestedBy')) +
          '</strong> ' +
          esc(act.attestedBy) +
          '</span><span class="stamp">' +
          esc(S.lang === 'hi' ? 'प्रमाणित' : 'Attested') +
          '</span></div></div>';
      }

      html += '</div>';

      html +=
        '<div class="row" style="margin-top:.6rem"><button class="btn btn--primary btn--sm" type="button" data-clear="' +
        act.id +
        '">' +
        esc(t('clear')) +
        '</button>' +
        '<button class="btn btn--ghost btn--sm" type="button" data-return="' +
        act.id +
        '">' +
        esc(t('returnToSchool')) +
        '</button></div>';

      html +=
        '<details style="margin-top:.4rem"><summary class="faint">' +
        esc(t('returnReason')) +
        '</summary><input id="rr-' +
        act.id +
        '" type="text" style="margin-top:.35rem" /></details>';

      html += '</div>';
    });

    screenEl.innerHTML = html;
  }

  function renderRoster() {
    var html =
      '<div><h1 class="screen__title">' +
      esc(t('tabRoster')) +
      '</h1><p class="screen__sub">' +
      esc(t('consentExplain')) +
      '</p></div>';

    S.students.forEach(function (s) {
      html +=
        '<div class="card"><div class="rowline"><span><strong>' +
        esc(loc(s.name)) +
        '</strong><br><span class="faint">' +
        esc(t('classLabel')) +
        ' ' +
        esc(s.cls) +
        ' · ' +
        esc(t('guardianLabel')) +
        ': ' +
        esc(loc(s.guardian)) +
        '</span></span>' +
        consentTag(s) +
        '</div>';

      if (s.consent === 'GRANTED') {
        html +=
          '<details style="margin-top:.5rem"><summary>' +
          esc(t('withdrawConsent')) +
          '</summary><p class="notice notice--warn" style="margin-top:.5rem">' +
          esc(t('withdrawWarn')) +
          '</p><div class="field" style="margin-top:.5rem"><label for="wd-' +
          s.id +
          '">' +
          esc(t('withdrawReason')) +
          '</label><input id="wd-' +
          s.id +
          '" type="text" /></div>' +
          '<button class="btn btn--stop btn--block" type="button" data-withdraw="' +
          s.id +
          '" style="margin-top:.5rem">' +
          esc(t('withdrawConsent')) +
          '</button></details>';
      } else {
        html +=
          '<button class="btn btn--block" type="button" data-consent="' +
          s.id +
          '" style="margin-top:.5rem">' +
          esc(t('recordConsent')) +
          '</button>';
      }
      html += '</div>';
    });

    screenEl.innerHTML = html;
  }

  function renderShowcase() {
    var pub = S.activities.filter(function (a) {
      return a.status === 'PUBLISHED' && a.visibility === 'PUBLIC';
    });

    var html =
      '<div><h1 class="screen__title">' +
      esc(t('showcaseTitle')) +
      '</h1><p class="screen__sub">' +
      esc(t('showcaseSub')) +
      '</p></div>';

    if (!pub.length) html += '<p class="empty">' + esc(t('showcaseEmpty')) + '</p>';

    pub.forEach(function (a) {
      html +=
        '<div class="card"><div class="photo" style="margin-bottom:.6rem">' +
        illustration(a.photo) +
        '</div><h2 style="font-size:1.05rem">' +
        esc(loc(a.title)) +
        '</h2><p class="faint">' +
        esc(loc(S.school.name)) +
        ' · ' +
        esc(fmtDate(a.date)) +
        '</p><p style="margin-top:.4rem;white-space:pre-wrap">' +
        esc(loc(a.desc)) +
        '</p><div class="row" style="margin-top:.6rem">';

      a.students.forEach(function (id) {
        var s = studentById(id);
        // Only children with consent in force, and only their given name.
        if (!s || s.consent !== 'GRANTED') return;
        html +=
          '<span class="tag tag--warn">' +
          esc(loc(s.given)) +
          ' · ' +
          esc(t('classLabel')) +
          ' ' +
          esc(s.cls) +
          '</span>';
      });

      html += '</div></div>';
    });

    if (pub.length) html += '<p class="notice">' + esc(t('surnameNote')) + '</p>';

    html +=
      '<div class="card"><p class="eyebrow">' +
      esc(t('feedbackLabel')) +
      '</p><p class="faint" style="margin:.2rem 0 .5rem">' +
      esc(t('feedbackHint')) +
      '</p><textarea id="notes">' +
      esc(S.notes) +
      '</textarea>' +
      '<button class="btn btn--block" type="button" id="copy-notes" style="margin-top:.5rem">' +
      esc(t('copyNotes')) +
      '</button></div>';

    screenEl.innerHTML = html;
  }

  // -------------------------------------------------------------------
  // Actions
  // -------------------------------------------------------------------

  function findActivity(id) {
    return S.activities.filter(function (a) {
      return a.id === id;
    })[0];
  }

  function showBlockers(lines) {
    clearToast();
    var slot = document.getElementById('blocker-slot');
    var box = document.createElement('div');
    box.className = 'notice notice--stop';
    box.setAttribute('role', 'alert');
    box.style.marginTop = '.6rem';
    box.innerHTML =
      '<ul style="margin:0;padding-inline-start:1.1rem;font-weight:500">' +
      lines
        .map(function (line) {
          return '<li>' + esc(line) + '</li>';
        })
        .join('') +
      '</ul>';
    (slot || screenEl).appendChild(box);
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function raiseClaim() {
    var udise = (document.getElementById('udise') || {}).value || '09460100199';
    var name = (document.getElementById('sname') || {}).value || 'PS Nayagaon';
    var claimant = (document.getElementById('cname') || {}).value || 'Kamla Devi';
    var designation = (document.getElementById('cdesig') || {}).value || 'Head Teacher';

    S.claim = {
      udise: udise,
      name: { hi: name, en: name },
      claimant: claimant,
      designation: designation,
      status: 'PENDING',
    };
    markDone('claimRaised');
    toast(t('claimSent'));
    render();
  }

  function verifyClaim() {
    if (!S.claim) return;
    S.claim.status = 'VERIFIED';
    markDone('claimVerified');
    toast(
      S.lang === 'hi'
        ? 'विद्यालय बन गया और दावा करने वाले प्रधानाध्यापक नियुक्त हो गए।'
        : 'The school now exists and the claimant is its head teacher.',
    );
    render();
  }

  function rejectClaim() {
    if (!S.claim) return;
    S.claim = null;
    toast(
      S.lang === 'hi'
        ? 'दावा अस्वीकार। UDISE कोड फिर से दावे के लिए खुला है।'
        : 'Claim rejected. The UDISE code is free to be claimed again.',
    );
    render();
  }

  function submitActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    act.status = 'PENDING';
    act.reason = null;
    markDone('submitted');
    toast(
      S.lang === 'hi'
        ? 'प्रधानाध्यापक को भेज दिया गया।'
        : 'Sent to the head teacher.',
    );
    S.open = null;
    render();
  }

  function publishInSchool(id) {
    var act = findActivity(id);
    if (!act) return;
    act.status = 'PUBLISHED';
    act.visibility = 'SCHOOL';
    act.clearance = 'NOT_REQUIRED';
    toast(
      S.lang === 'hi'
        ? 'विद्यालय के भीतर प्रकाशित। यहाँ किसी और की स्वीकृति नहीं चाहिए।'
        : 'Published inside the school. Nobody else’s approval is needed here.',
    );
    S.open = null;
    render();
  }

  function sendOn(id) {
    var act = findActivity(id);
    if (!act) return;

    var attested = (document.getElementById('attest') || {}).checked;
    var target = (document.getElementById('target') || {}).value || 'BLOCK';

    if (!attested) {
      markDone('attestNeeded');
      renderWhy();
      renderSteps();
      save();
      showBlockers([t('attestNeeded')]);
      return;
    }

    var assessment = assessRisk(act);
    act.attestedBy = t('roleHeadWho');
    act.status = 'PUBLISHED';
    act.target = target;
    act.risk = assessment.flags;
    act.score = assessment.score;

    // A new school is reviewed at 100%, and a flagged activity is never
    // sampled away — so in this demo it always waits for the block.
    var mustReview = assessment.flags.length > 0 || Math.random() < SAMPLE_RATE[S.school.tier];
    act.clearance = mustReview ? 'AWAITING_BLOCK' : 'AUTO_CLEARED';
    // Never visible above the level actually cleared.
    act.visibility = mustReview ? 'SCHOOL' : target;

    markDone('attested');
    if (mustReview) S.done.stillSchool = true;
    S.why = 'attested';
    S.open = null;

    var reused = assessment.flags.some(function (f) {
      return f.code.indexOf('PHOTO_REUSED') === 0;
    });
    if (reused) S.why = 'photoReused';

    toast(
      mustReview
        ? S.lang === 'hi'
          ? 'प्रमाणित। अब खंड जाँच की प्रतीक्षा — तब तक सिर्फ़ विद्यालय तक दिखेगा।'
          : 'Attested. Waiting for block clearance — visible only inside the school until then.'
        : S.lang === 'hi'
          ? 'प्रमाणित और स्वतः स्वीकृत।'
          : 'Attested and auto-cleared.',
    );
    render();
  }

  function clearActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    act.clearance = 'CLEARED';
    act.visibility = act.target || 'BLOCK';
    S.school.cleared += 1;
    if (S.school.cleared >= 20) S.school.tier = 'TRUSTED';
    else if (S.school.cleared >= 5) S.school.tier = 'STANDARD';
    markDone('blockCleared');
    toast(
      S.lang === 'hi'
        ? 'स्वीकृत। अब यह ' + t('vis' + act.visibility) + ' पर दिख रहा है।'
        : 'Cleared. It is now visible at ' + t('vis' + act.visibility) + '.',
    );
    render();
  }

  function returnActivity(id) {
    var act = findActivity(id);
    if (!act) return;
    var input = document.getElementById('rr-' + id);
    var reason = input ? input.value.trim() : '';
    if (reason.length < 3) {
      toast(
        S.lang === 'hi'
          ? 'कारण लिखे बिना वापस नहीं किया जा सकता।'
          : 'You cannot send work back without a reason.',
      );
      return;
    }
    act.clearance = 'RETURNED';
    act.status = 'REJECTED';
    act.visibility = 'SCHOOL';
    act.reason = reason;
    S.school.returned += 1;
    S.school.tier = 'WATCH';
    S.why = 'returned';
    toast(
      S.lang === 'hi'
        ? 'विद्यालय को वापस भेजा गया। विद्यालय अब छह महीने निगरानी में है।'
        : 'Sent back. The school is under watch for six months.',
    );
    render();
  }

  function makePublic(id) {
    var act = findActivity(id);
    if (!act) return;

    var problems = [];
    if (act.clearance !== 'CLEARED') {
      problems.push(
        S.lang === 'hi'
          ? 'सार्वजनिक करने से पहले खंड अधिकारी की वास्तविक जाँच ज़रूरी है।'
          : 'The open web needs a block officer to have actually cleared this first.',
      );
    }
    var missing = act.students
      .map(studentById)
      .filter(function (s) {
        return s && s.consent !== 'GRANTED';
      })
      .map(function (s) {
        return loc(s.name);
      });
    if (missing.length) {
      problems.push(
        (S.lang === 'hi'
          ? 'इनकी अभिभावक सहमति दर्ज नहीं है: '
          : 'Guardian consent is not recorded for: ') + missing.join(', '),
      );
    }

    if (problems.length) {
      markDone('publicBlocked');
      renderWhy();
      renderSteps();
      save();
      showBlockers(problems);
      return;
    }

    act.visibility = 'PUBLIC';
    markDone('published');
    toast(
      S.lang === 'hi' ? 'सार्वजनिक रूप से प्रकाशित।' : 'Published publicly.',
    );
    S.open = null;
    S.tab = 'showcase';
    render();
  }

  function recordConsent(id) {
    var s = studentById(id);
    if (!s) return;
    s.consent = 'GRANTED';
    markDone('consentGiven');
    toast(
      S.lang === 'hi'
        ? 'सहमति दर्ज हो गई।'
        : 'Consent recorded.',
    );
    render();
  }

  function withdrawConsent(id) {
    var s = studentById(id);
    if (!s) return;
    var input = document.getElementById('wd-' + id);
    var reason = input ? input.value.trim() : '';
    if (reason.length < 3) {
      toast(S.lang === 'hi' ? 'कृपया कारण लिखिए।' : 'Please give a reason.');
      return;
    }
    s.consent = 'REVOKED';

    // The rule that matters: withdrawal reaches everything already published,
    // in the same action, not in a queue.
    var pulled = 0;
    S.activities.forEach(function (a) {
      if (a.visibility === 'PUBLIC' && a.students.indexOf(id) >= 0) {
        a.visibility = 'DISTRICT';
        pulled++;
      }
    });

    markDone('withdrawn');
    toast(
      pulled
        ? S.lang === 'hi'
          ? pulled + ' सार्वजनिक गतिविधि तुरंत हटा दी गई।'
          : pulled + ' public activity removed immediately.'
        : S.lang === 'hi'
          ? 'सहमति वापस ले ली गई।'
          : 'Consent withdrawn.',
    );
    render();
  }

  // -------------------------------------------------------------------
  // Wiring
  // -------------------------------------------------------------------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest
      ? ev.target.closest(
          '[data-track],[data-role],[data-tab],[data-open],[data-back],[data-submit],' +
            '[data-publish-school],[data-send-on],[data-make-public],[data-clear],[data-return],' +
            '[data-consent],[data-withdraw],[data-raise-claim],[data-verify-claim],' +
            '[data-reject-claim],[data-try-blocked],#copy-notes',
        )
      : null;
    if (!el) return;

    if (el.dataset.track) {
      S.track = el.dataset.track;
      S.role = S.track === 'join' ? 'CLAIMANT' : 'TEACHER';
      S.open = null;
      S.why = 'welcome';
      return render();
    }
    if (el.dataset.role) {
      S.role = el.dataset.role;
      S.open = null;
      return render();
    }
    if (el.dataset.tab) {
      S.tab = el.dataset.tab;
      S.open = null;
      return render();
    }
    if (el.dataset.open) {
      S.open = el.dataset.open;
      return render();
    }
    if (el.dataset.back) {
      S.open = null;
      return render();
    }

    if (el.dataset.raiseClaim) return raiseClaim();
    if (el.dataset.verifyClaim) return verifyClaim();
    if (el.dataset.rejectClaim) return rejectClaim();
    if (el.dataset.tryBlocked) {
      markDone('claimBlocked');
      renderWhy();
      renderSteps();
      save();
      toast(
        S.lang === 'hi'
          ? 'पुष्टि से पहले इस विद्यालय में कुछ भी दर्ज नहीं हो सकता।'
          : 'Nothing can be recorded at this school before it is confirmed.',
      );
      return;
    }

    if (el.dataset.submit) return submitActivity(el.dataset.submit);
    if (el.dataset.publishSchool) return publishInSchool(el.dataset.publishSchool);
    if (el.dataset.sendOn) return sendOn(el.dataset.sendOn);
    if (el.dataset.makePublic) return makePublic(el.dataset.makePublic);
    if (el.dataset.clear) return clearActivity(el.dataset.clear);
    if (el.dataset.return) return returnActivity(el.dataset.return);
    if (el.dataset.consent) return recordConsent(el.dataset.consent);
    if (el.dataset.withdraw) return withdrawConsent(el.dataset.withdraw);

    if (el.id === 'copy-notes') {
      var area = document.getElementById('notes');
      S.notes = area ? area.value : '';
      save();
      var payload =
        'BalSanskar demo — ' +
        new Date().toLocaleString() +
        '\nTrack: ' +
        S.track +
        '\nRole: ' +
        S.role +
        '\nLanguage: ' +
        S.lang +
        '\nSteps completed: ' +
        Object.keys(S.done).join(', ') +
        '\n\n' +
        S.notes;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(
          function () {
            toast(t('copied'));
          },
          function () {
            toast(t('copyFailed'));
          },
        );
      } else {
        toast(t('copyFailed'));
      }
    }
  });

  document.getElementById('lang-toggle').addEventListener('click', function () {
    S.lang = S.lang === 'hi' ? 'en' : 'hi';
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    var lang = S.lang;
    S = seed();
    S.lang = lang;
    render();
  });

  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'notes') S.notes = ev.target.value;
  });

  render();
</script>

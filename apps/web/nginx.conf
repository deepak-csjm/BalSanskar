# Static hosting for the BalSanskar PWA.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The bundle is small; gzip makes it smaller still, which is the whole point
  # on the connections these users have.
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # This host serves only its own files and talks to one API. Anything wider
  # would let an injected script exfiltrate a session token.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Hashed assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The service worker and the manifest must not be cached, or a released fix
  # never reaches the phone that needs it.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Single-page application: every unknown path is a client route.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
